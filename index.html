<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OPERATION: IRON SKY</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON SKY">
<meta name="theme-color" content="#07090d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07090d;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
       background:radial-gradient(ellipse at center,#1a2230 0%,#07090d 75%);
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;box-shadow:0 0 60px rgba(0,0,0,.9);touch-action:none;cursor:crosshair}
  .f{font-family:"Press Start 2P";position:absolute;opacity:0}
  /* 터치 기기 전용 화면 버튼 */
  #pad{display:none}
  .touch #pad{display:block}
  .btn{position:fixed;z-index:5;touch-action:none;display:flex;align-items:center;justify-content:center;
       font:10px "Press Start 2P",monospace;color:#fff;text-shadow:0 1px 2px #000;border-radius:50%;
       background:rgba(20,28,40,.45);border:2px solid rgba(255,255,255,.35);box-sizing:border-box}
  .btn.on{background:rgba(255,200,60,.55);border-color:#ffe08a}
  .big{width:74px;height:74px;bottom:calc(env(safe-area-inset-bottom) + 18px)}
  #bBomb{right:calc(env(safe-area-inset-right) + 16px);background:rgba(40,120,40,.5)}
  #bCharge{left:calc(env(safe-area-inset-left) + 16px);background:rgba(30,90,170,.5)}
  .small{width:40px;height:40px;top:calc(env(safe-area-inset-top) + 10px);font-size:9px}
  #bPause{right:calc(env(safe-area-inset-right) + 12px)}
  #bMute{right:calc(env(safe-area-inset-right) + 60px)}
</style>
</head>
<body>
<span class="f">IRON SKY</span>
<canvas id="game"></canvas>
<div id="pad">
  <div class="btn big" id="bCharge">CHARGE</div>
  <div class="btn big" id="bBomb">BOMB</div>
  <div class="btn small" id="bMute">♪</div>
  <div class="btn small" id="bPause">II</div>
</div>
<script src="story-data.js"></script>
<script src="assets/story/manifest.js"></script>
<script src="story.js"></script>
<script src="game.js"></script>
<script>
(() => {
  // 터치 기기에서만 화면 버튼 표시. 버튼은 게임의 키 입력(C/X/P/M)을 그대로 흉내 낸다.
  if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.documentElement.classList.add('touch');
  const key = (type, code) => dispatchEvent(new KeyboardEvent(type, { code, bubbles: true }));
  const bind = (id, code, hold) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('on'); key('keydown', code); if (!hold) setTimeout(() => key('keyup', code), 60); });
    const up = e => { if (!el.classList.contains('on')) return; el.classList.remove('on'); if (hold) key('keyup', code); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  };
  bind('bCharge', 'KeyC', true); bind('bBomb', 'KeyX'); bind('bPause', 'KeyP'); bind('bMute', 'KeyM');
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  // 오프라인 실행용 캐시 (https 또는 localhost 에서만 동작)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
